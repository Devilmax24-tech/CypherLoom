services:
  - type: web
    name: cypherlook
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: cypherlook_db
          property: connectionString
      - key: GOOGLE_DRIVE_FOLDER_ID
        sync: false
      - key: SERVICE_ACCOUNT_FILE
        sync: false

databases:
  - name: cypherlook_db
    databaseName: cypherlook
    user: cypherlook_user